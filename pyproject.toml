[project]
name = "plsql-lens"
version = "0.1.0"
description = "Analyze Oracle PL/SQL packages: inventory, call graph, review rules, utPLSQL generation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
plsql-lens = "plsql_lens.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plsql_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs an Oracle container (not run in unit CI)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["corpus", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.report]
# SPEC §7: >= 85 % lines on src/, excluding Oracle-container integration paths (none exist yet).
omit = ["src/plsql_lens/testgen/runner*"]

[tool.ruff.lint.per-file-ignores]
"scripts/phase3_summary.py" = ["E501"]
"tests/fixtures/testgen/fake_sqlplus.py" = ["E501"]
