[project]
name = "plsql-lens"
version = "0.1.0"
description = "Analyze Oracle PL/SQL packages: inventory, call graph, review rules, utPLSQL generation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]
keywords = ["plsql", "oracle", "static-analysis", "code-review", "sarif", "utplsql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/andresaragon/plsql-lens"
Repository = "https://github.com/andresaragon/plsql-lens"
Issues = "https://github.com/andresaragon/plsql-lens/issues"
Changelog = "https://github.com/andresaragon/plsql-lens/blob/main/CHANGELOG.md"

[project.scripts]
plsql-lens = "plsql_lens.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.26.0",
    "pyyaml>=6",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plsql_lens"]

# Without this the sdist carries every tracked file (corpus, benchmarks, tests, spikes, workflows).
# It keeps the code, the metadata files and the project documents.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
    "/README.md",
    "/README.es.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs an Oracle container (not run in unit CI)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["corpus", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.report]
# SPEC §7: >= 85 % lines on src/, excluding Oracle-container integration paths (none exist yet).
omit = ["src/plsql_lens/testgen/runner*"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]
"src/plsql_lens/bench/*.py" = ["E501"]
"tests/fixtures/testgen/fake_sqlplus.py" = ["E501"]
"tests/unit/test_bench_*.py" = ["E501"]
"src/plsql_lens/bench/run.py" = ["E501", "SIM102"]
